name: lint

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  lint:
    name: Syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1

      - name: Check Lua syntax
        run: |
          for f in lua/*.lua; do
            luac -p "$f" || exit 1
          done
          echo "All Lua files passed"

      - name: Check deploy.sh syntax
        run: bash -n deploy.sh && echo "deploy.sh passed"
