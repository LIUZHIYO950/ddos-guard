<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>安全验证</title>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f5f6f8;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
  .card{background:#fff;padding:36px 48px;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.08);text-align:center;max-width:420px}
  h2{margin:0 0 8px;color:#222;font-size:20px}
  p{color:#666;font-size:14px;line-height:1.6;margin:0}
  .spinner{margin:16px auto;width:28px;height:28px;border:3px solid #e2e6ea;border-top-color:#3b82f6;border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="card">
  <h2>安全验证</h2>
  <p>正在检测您的访问环境，请稍候……</p>
  <div class="spinner"></div>
</div>
<script>
(function(){
  var params = new URLSearchParams(location.search);
  var nonce = params.get('nonce') || '';
  var diff = parseInt(params.get('d') || '4', 10);
  var back = params.get('back') || '/';

  // 紧凑 SHA1 实现（无外部依赖，HTTP/HTTPS 均可用）
  function sha1(str){
    function rotateLeft(n,b){return (n<<b)|(n>>>(32-b))}
    function toHexStr(n){var s="",v;for(var i=7;i>=0;i--){v=(n>>>(i*4))&0xf;s+=v.toString(16)}return s}
    var blockstart,i,j,W=new Array(80),H0=0x67452301,H1=0xEFCDAB89,H2=0x98BADCFE,H3=0x10325476,H4=0xC3D2E1F0,A,B,C,D,E,temp;
    var str_len=str.length, word_array=[];
    for(i=0;i<str_len-3;i+=4){
      j=str.charCodeAt(i)<<24|str.charCodeAt(i+1)<<16|str.charCodeAt(i+2)<<8|str.charCodeAt(i+3);
      word_array.push(j);
    }
    switch(str_len%4){
      case 0: i=0x080000000;break;
      case 1: i=str.charCodeAt(str_len-1)<<24|0x0800000;break;
      case 2: i=str.charCodeAt(str_len-2)<<24|str.charCodeAt(str_len-1)<<16|0x08000;break;
      case 3: i=str.charCodeAt(str_len-3)<<24|str.charCodeAt(str_len-2)<<16|str.charCodeAt(str_len-1)<<8|0x80;break;
    }
    word_array.push(i);
    while((word_array.length%16)!==14) word_array.push(0);
    word_array.push(str_len>>>29);
    word_array.push((str_len<<3)&0x0ffffffff);
    for(blockstart=0;blockstart<word_array.length;blockstart+=16){
      for(i=0;i<16;i++) W[i]=word_array[blockstart+i];
      for(i=16;i<=79;i++) W[i]=rotateLeft(W[i-3]^W[i-8]^W[i-14]^W[i-16],1);
      A=H0;B=H1;C=H2;D=H3;E=H4;
      for(i=0;i<=79;i++){
        if(i<20) temp=(rotateLeft(A,5)+((B&C)|(~B&D))+E+W[i]+0x5A827999)&0x0ffffffff;
        else if(i<40) temp=(rotateLeft(A,5)+(B^C^D)+E+W[i]+0x6ED9EBA1)&0x0ffffffff;
        else if(i<60) temp=(rotateLeft(A,5)+((B&C)|(B&D)|(C&D))+E+W[i]+0x8F1BBCDC)&0x0ffffffff;
        else temp=(rotateLeft(A,5)+(B^C^D)+E+W[i]+0xCA62C1D6)&0x0ffffffff;
        E=D;D=C;C=rotateLeft(B,30);B=A;A=temp;
      }
      H0=(H0+A)&0x0ffffffff;H1=(H1+B)&0x0ffffffff;H2=(H2+C)&0x0ffffffff;H3=(H3+D)&0x0ffffffff;H4=(H4+E)&0x0ffffffff;
    }
    return (toHexStr(H0)+toHexStr(H1)+toHexStr(H2)+toHexStr(H3)+toHexStr(H4)).toLowerCase();
  }

  var target = new Array(diff+1).join('0');
  var proof = 0;
  while(true){
    if(sha1(nonce + proof).indexOf(target) === 0) break;
    proof++;
  }
  location.href = '/challenge/verify?proof=' + proof +
                  '&nonce=' + encodeURIComponent(nonce) +
                  '&back=' + encodeURIComponent(back);
})();
</script>
</body>
</html>
